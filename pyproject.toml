[project]
name = "marathon"
version = "0.1.0"
description = "A bare-bones loop for coding agents that run for hours on one goal."
authors = [{ name = "Ravi Vats" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
marathon = "marathon.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["marathon"]
